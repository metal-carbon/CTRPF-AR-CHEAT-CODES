<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faceless Instagram Brand — 6 AI Prompts</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f5c518 0%, #ff6b35 50%, #e91e8c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    header p {
      color: #888;
      font-size: 0.95rem;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 28px 26px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s, transform 0.2s;
      position: relative;
    }

    .card:hover {
      border-color: #444;
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .prompt-number {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #555;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 99px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card:nth-child(1) .badge { background: #1a1a2e; color: #7b8cde; border: 1px solid #2a2a4e; }
    .card:nth-child(2) .badge { background: #1a2a1a; color: #6dde8c; border: 1px solid #2a4a2a; }
    .card:nth-child(3) .badge { background: #2a1a1a; color: #de6d6d; border: 1px solid #4a2a2a; }
    .card:nth-child(4) .badge { background: #1a2a2a; color: #6ddecc; border: 1px solid #2a4a4a; }
    .card:nth-child(5) .badge { background: #2a2a1a; color: #dece6d; border: 1px solid #4a4a2a; }
    .card:nth-child(6) .badge { background: #2a1a2a; color: #ce6dde; border: 1px solid #4a2a4a; }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      color: #f0f0f0;
    }

    .prompt-box {
      background: #0d0d0d;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      padding: 16px;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #bbb;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .model-tag {
      font-size: 0.7rem;
      color: #444;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #999;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 12px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .copy-btn:hover {
      background: #2a2a2a;
      color: #f0f0f0;
      border-color: #444;
    }

    .copy-btn.copied {
      color: #6dde8c;
      border-color: #2a4a2a;
      background: #1a2a1a;
    }

    .copy-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    footer {
      text-align: center;
      margin-top: 64px;
      color: #333;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Faceless Instagram Brand — 6 AI Prompts</h1>
  <p>Use these in sequence to research, build, grow, and monetize a faceless brand-sponsored Instagram page.</p>
</header>

<div class="grid" id="grid"></div>

<footer>Prompts via @itsalexanderlari &nbsp;·&nbsp; Model: Opus 4.8 High</footer>

<script>
const prompts = [
  {
    label: "Niche Research",
    title: "This pulls a shortlist of high demand niches where brands already pay to advertise.",
    text: "Identify a curated set of high demand niches for a faceless, brand monetized Instagram page where sponsors actively pay premium rates for placement. Prioritize categories where advertiser spend is outpacing the number of established pages, and avoid oversaturated verticals entirely. For each niche, provide a concise analysis covering the type of brands that sponsor in that space, the typical pay range per sponsored post, the core demand driver fueling advertiser interest right now, and the content format best suited to faceless production. Weight your selections toward niches with repeatable content structures, strong save and share behavior, and a clear path to consistent brand inbound at volume."
  },
  {
    label: "Page Identity",
    title: "This builds the entire page, name, bio and identity, so it reads like a real media brand.",
    text: "Using the niche selected above, architect a complete faceless Instagram page that reads as an established media brand rather than a personal account. Deliver five page name options that signal authority and editorial credibility, a bio under 150 characters engineered to attract brand sponsors and communicate positioning instantly, a logo style profile picture concept with no face, and a defined content pillar structure I can post against three to five times per week. Every element should make the page feel premium, trustworthy, and immediately ad ready to a brand evaluating it for a partnership."
  },
  {
    label: "Content Creation",
    title: "This creates scroll stopping carousels designed to grow the page fast.",
    text: "Drawing from the chosen niche, develop a set of carousel concepts engineered for maximum saves, shares, and follower conversion on a faceless Instagram page. Each concept must be anchored in a proven retention framework, whether a curiosity gap, a contrarian angle, an authority led warning, or a status driven payoff. For every entry deliver a scroll stopping hook under ten words, a slide by slide structure that escalates tension and resolves on a transformation, and the dominant psychological trigger driving the engagement. Discard generic or surface level ideas entirely. Every concept should feel native to the niche and built to perform inside an oversaturated feed."
  },
  {
    label: "Competitor Audit",
    title: "This shows you what's already working in your niche so you can model it instead of guessing.",
    text: "Conduct a systematic audit of the top performing faceless pages in this niche, the accounts consistently generating outsized reach and brand deals. Evaluate what each is executing differently across content angles, posting cadence, hook mechanics, visual identity, and the way they position themselves to sponsors. Distinguish between market wide patterns that signal proven tactics versus proprietary approaches unique to individual operators. Surface the exploitable gaps and overlooked opportunities in their current strategy, then distill it all into clear, actionable intelligence: what to replicate, what to deliberately avoid, and how to position a new page to win attention while capitalizing on validated demand."
  },
  {
    label: "Brand Deals",
    title: "This closes brand deals at premium rates the moment they DM you.",
    text: "My faceless Instagram page is receiving inbound DMs from brands asking about sponsored placements. Write a three message reply sequence engineered to close them at premium rates without sounding desperate. The first message should position the page as paid ad inventory and qualify what the brand is looking for. The second should present a concrete sponsorship package with clear pricing and the specific reasons this audience converts for advertisers. The third should be a soft close that removes friction and locks in the commitment. The tone throughout should read as a business owner granting access to a valuable asset, never a creator asking for a favor."
  },
  {
    label: "Autopilot System",
    title: "This puts the whole page on autopilot so it runs in under an hour a day.",
    text: "Build me a content and operations system that runs a faceless Instagram page on near total autopilot. Deliver a weekly content calendar mapped to my niche, a reusable prompt library that regenerates fresh carousels each week without starting from scratch, the best free tools for scheduling everything in advance, and a streamlined workflow I can execute in under an hour a day. Then outline how to replicate the entire system across multiple pages so the operation scales into a portfolio without scaling my time. The page should keep growing and earning whether or not I show up on any given day."
  }
];

const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

const grid = document.getElementById("grid");

prompts.forEach((p, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-header">
      <span class="prompt-number">Prompt ${i + 1}</span>
      <span class="badge">${p.label}</span>
    </div>
    <div class="card-title">${p.title}</div>
    <div class="prompt-box" id="text-${i}">${p.text}</div>
    <div class="card-footer">
      <span class="model-tag">Opus 4.8 · High</span>
      <button class="copy-btn" id="btn-${i}" onclick="copyPrompt(${i})">
        ${copyIcon} Copy prompt
      </button>
    </div>
  `;
  grid.appendChild(card);
});

function copyPrompt(i) {
  const text = prompts[i].text;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(`btn-${i}`);
    btn.innerHTML = `${checkIcon} Copied`;
    btn.classList.add("copied");
    setTimeout(() => {
      btn.innerHTML = `${copyIcon} Copy prompt`;
      btn.classList.remove("copied");
    }, 2000);
  });
}
</script>
</body>
</html>
